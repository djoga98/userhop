[package]
name = "fluent-account-switcher"
version = "0.1.0"
description = "Fluent-style operating-system account and session switcher"
authors = ["Fluent Account Switcher contributors"]
license = "MIT"
edition = "2024"
rust-version = "1.90"

[lib]
name = "fluent_account_switcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
tauri = { version = "2.12.6", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-autostart = "2.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2.5.5"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
libc = "0.2.191"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "block2",
  "NSDistributedNotificationCenter",
  "NSNotification",
  "NSOperation",
  "NSString",
] }
plist = "1.10.4"
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.19.0"
rustix = { version = "1.1.6", default-features = false, features = ["std", "process"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_NetManagement",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Shutdown",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
plist = "1.10.4"
ts-rs = { version = "12.0.1", features = ["serde-compat", "no-serde-warnings"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
