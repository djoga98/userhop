<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" role="img" aria-labelledby="t d">
  <title id="t">How switching works</title>
  <desc id="d">Press the shortcut, pick an account, then your operating system shows its own sign-in screen. Your apps keep running.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2547"/>
      <stop offset="1" stop-color="#151b36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FA3F7"/>
      <stop offset="1" stop-color="#7b5cf5"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 10 5 0 10z" fill="#7d8cc4"/>
    </marker>
  </defs>
  <rect width="1200" height="250" rx="22" fill="#0f1428"/>
  <g font-family="'Segoe UI Variable Text', 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <g transform="translate(40 40)">
      <rect width="330" height="170" rx="16" fill="url(#card)" stroke="#2b3666"/>
      <circle cx="44" cy="46" r="22" fill="url(#accent)"/>
      <text x="44" y="53" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">1</text>
      <text x="28" y="104" font-size="22" font-weight="650" fill="#fff">Press Win + Shift + U</text>
      <text x="28" y="136" font-size="17" fill="#aab3d6">or click the tray icon.</text>
    </g>
    <line x1="378" y1="125" x2="430" y2="125" stroke="#7d8cc4" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(435 40)">
      <rect width="330" height="170" rx="16" fill="url(#card)" stroke="#2b3666"/>
      <circle cx="44" cy="46" r="22" fill="url(#accent)"/>
      <text x="44" y="53" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">2</text>
      <text x="28" y="104" font-size="22" font-weight="650" fill="#fff">Pick an account</text>
      <text x="28" y="136" font-size="17" fill="#aab3d6">with the mouse or arrow keys.</text>
    </g>
    <line x1="773" y1="125" x2="825" y2="125" stroke="#7d8cc4" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(830 40)">
      <rect width="330" height="170" rx="16" fill="url(#card)" stroke="#2b3666"/>
      <circle cx="44" cy="46" r="22" fill="url(#accent)"/>
      <text x="44" y="53" text-anchor="middle" font-size="20" font-weight="700" fill="#fff">3</text>
      <text x="28" y="104" font-size="22" font-weight="650" fill="#fff">Sign in on the OS screen</text>
      <text x="28" y="136" font-size="17" fill="#aab3d6">Your apps keep running.</text>
    </g>
  </g>
</svg>
