<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Fluent Account Switcher</title>
  <desc id="desc">Switch between the accounts on your PC from a tiny Fluent-style flyout.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1630"/>
      <stop offset="0.55" stop-color="#18245a"/>
      <stop offset="1" stop-color="#3a1f6e"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.18" cy="0.1" r="0.55">
      <stop offset="0" stop-color="#3b6cf6" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#3b6cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.92" cy="1" r="0.6">
      <stop offset="0" stop-color="#a24bff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#a24bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FA3F7"/>
      <stop offset="1" stop-color="#1C5FC9"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3EEFC"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="24" fill="url(#glowA)"/>
  <rect width="1280" height="340" rx="24" fill="url(#glowB)"/>
  <g transform="translate(96 82) scale(0.172)">
    <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#tile)"/>
    <g fill="#FFFFFF" fill-opacity="0.42">
      <circle cx="642" cy="372" r="118"/>
      <path d="M442 760c0-136 90-226 200-226s200 90 200 226v18H442z"/>
    </g>
    <g fill="url(#front)">
      <circle cx="420" cy="420" r="132"/>
      <path d="M196 830c0-150 100-250 224-250s224 100 224 250v24H196z"/>
    </g>
  </g>
  <g font-family="'Segoe UI Variable Display', 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" fill="#ffffff">
    <text x="300" y="158" font-size="62" font-weight="700" letter-spacing="-1.2">Fluent Account Switcher</text>
    <text x="302" y="210" font-size="24" fill-opacity="0.82">Switch between the accounts on your computer from a tiny, keyboard-first flyout.</text>
    <g font-size="18" font-weight="600">
      <rect x="302" y="240" width="176" height="40" rx="20" fill="#ffffff" fill-opacity="0.12"/>
      <text x="390" y="266" text-anchor="middle">Windows 10/11</text>
      <rect x="492" y="240" width="104" height="40" rx="20" fill="#ffffff" fill-opacity="0.12"/>
      <text x="544" y="266" text-anchor="middle">macOS</text>
      <rect x="610" y="240" width="96" height="40" rx="20" fill="#ffffff" fill-opacity="0.12"/>
      <text x="658" y="266" text-anchor="middle">Linux</text>
      <rect x="720" y="240" width="208" height="40" rx="20" fill="#ffffff" fill-opacity="0.12"/>
      <text x="824" y="266" text-anchor="middle">No passwords stored</text>
      <rect x="942" y="240" width="154" height="40" rx="20" fill="#ffffff" fill-opacity="0.12"/>
      <text x="1019" y="266" text-anchor="middle">No telemetry</text>
    </g>
  </g>
</svg>
